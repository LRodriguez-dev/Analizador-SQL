name: Publicar Analizador SQL

on:
  push:
    branches:
      - Dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Diagnosticar y publicar Blazor WebAssembly
        shell: bash
        run: |
          echo 'Proyectos encontrados:'
          find . -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*'
          echo 'Archivos index.html en el repositorio:'
          find . -name 'index.html' -not -path '*/obj/*' -not -path '*/bin/*'
          echo 'Publicando proyecto...'
          dotnet publish -c Release -o ./publicacion
          echo 'Archivos index.html publicados:'
          find ./publicacion -name 'index.html'
          echo 'Directorios publicados:'
          find ./publicacion -maxdepth 4 -type d

      - name: Configurar ruta GitHub Pages
        shell: bash
        run: |
          if [ ! -f ./publicacion/wwwroot/index.html ]; then
            echo 'ERROR: No se encontro publicacion/wwwroot/index.html.'
            echo 'Revisa las rutas impresas en el paso anterior para identificar el proyecto WebAssembly.'
            exit 1
          fi
          sed -i 's|<base href="/" />|<base href="/Analizador-SQL/" />|g' ./publicacion/wwwroot/index.html
          touch ./publicacion/wwwroot/.nojekyll
          cp ./publicacion/wwwroot/index.html ./publicacion/wwwroot/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos publicados
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./publicacion/wwwroot

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
